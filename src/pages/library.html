<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unwatch Library</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header><h1>Unwatch</h1></header>
    <h2 id="h-settings">Settings</h2>
    <form id="settings">
      <label>
        <span id="l-lang">Language</span>
        <select name="lang">
          <option value="en">English</option>
          <option value="es">Español</option>
        </select>
      </label>
      <label>
        <span id="l-provider">Provider</span>
        <select name="provider">
          <option value="anthropic">anthropic</option>
          <option value="openai">openai</option>
          <option value="gemini">gemini</option>
        </select>
      </label>
      <label>
        <span id="l-model">Model</span>
        <input name="model" list="model-suggestions" placeholder="default for provider" />
        <datalist id="model-suggestions"></datalist>
      </label>
      <label>
        <span id="l-key">LLM key</span>
        <input name="llmKey" type="password" autocomplete="off" />
      </label>
      <label>
        <span id="l-fprompt">Extract prompt</span>
        <textarea name="filterPrompt" rows="7"></textarea>
      </label>
      <label>
        <span id="l-cprompt">Chat prompt</span>
        <textarea name="chatPrompt" rows="5"></textarea>
      </label>
      <div class="row">
        <button id="save-btn" class="primary" type="submit">Save</button>
        <button id="reset-prompts" type="button">Reset prompts</button>
        <span data-saved class="ok"></span>
      </div>
    </form>
    <h2 id="h-saved">Saved</h2>
    <p id="err" class="err"></p>
    <div id="list"></div>
    <p class="credit">
      Made by
      <a href="https://github.com/esauflores" target="_blank" rel="noopener">esauflores</a>
    </p>
    <script src="library.js"></script>
  </body>
</html>
