<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unwatch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="panel">
    <div id="loading" class="loading"><span class="spinner"></span></div>
    <header>
      <h1>Unwatch</h1>
      <button id="lib" class="ghost">Library &amp; settings</button>
    </header>
    <div class="tabs">
      <button id="tab-extract" class="tab active" data-view="extract">Extract</button>
      <button id="tab-chat" class="tab" data-view="chat" disabled>Chat</button>
      <button id="tab-download" class="tab" data-view="download" disabled>Download</button>
    </div>
    <p id="meta"></p>
    <p id="err" class="err"></p>
    <section id="view-extract">
      <button id="run" class="primary block">Extract from this video</button>
      <span id="verdict" class="verdict" hidden></span>
      <section id="out" class="md"></section>
    </section>
    <section id="view-chat" hidden>
      <deep-chat id="dc"></deep-chat>
    </section>
    <section id="view-download" hidden>
      <button id="dl-transcript" class="block">Transcript</button>
      <button id="dl-extract" class="block">Extract</button>
      <button id="dl-chat" class="block">Chat</button>
    </section>
    <script src="sidepanel.js"></script>
  </body>
</html>
