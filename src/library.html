<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>unwatch library</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header><h1>unwatch library</h1></header>
    <h2>Settings</h2>
    <form id="settings">
      <label>
        Language
        <select name="lang">
          <option value="en">English</option>
          <option value="es">Español</option>
        </select>
      </label>
      <label>
        Provider
        <select name="provider">
          <option value="anthropic">anthropic</option>
          <option value="openai">openai</option>
          <option value="gemini">gemini</option>
        </select>
      </label>
      <label>Model (optional)
        <input name="model" list="model-suggestions" placeholder="default for provider" />
        <datalist id="model-suggestions"></datalist>
      </label>
      <label>LLM key <input name="llmKey" type="password" autocomplete="off" /></label>
      <div class="row">
        <button class="primary" type="submit">Save</button>
        <span data-saved class="ok"></span>
      </div>
    </form>
    <h2>Saved</h2>
    <p id="err" class="err"></p>
    <div id="list"></div>
    <script src="library.js"></script>
  </body>
</html>
