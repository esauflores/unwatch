<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>unwatch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>unwatch</h1>
      <div class="hdr-btns">
        <button id="chat-toggle" class="ghost" hidden>Chat</button>
        <button id="lib" class="ghost">Library &amp; settings</button>
      </div>
    </header>
    <p id="meta"></p>
    <button id="run" class="primary block">Extract from this video</button>
    <p id="err" class="err"></p>
    <section id="out" class="md"></section>
    <div id="ask-panel" hidden>
      <h2>Ask</h2>
      <textarea id="q" placeholder="Ask this transcript…"></textarea>
      <div class="row">
        <button id="ask">Ask</button>
        <button id="conc">Notes</button>
      </div>
      <section id="chat" class="md"></section>
    </div>
    <script src="sidepanel.js"></script>
  </body>
</html>
